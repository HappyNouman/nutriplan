spring.application.name=backend
server.port=8123

# Secrets (DB password, JWT secret) live in application-local.properties, which is not committed
spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/nutriplan?createDatabaseIfNotExist=true
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
app.jwt.expiration-minutes=1440
